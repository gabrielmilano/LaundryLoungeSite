# --- Serviços: marcadores pendentes ---
servicos:
  tapetes:
    prazo: ""               # [PRAZO] ex.: "5 dias úteis" — aparece no hero, no passo 3 e no FAQ
    preco: ""               # [PREÇO] só o número, ex.: "25,00" — liga a seção Preço, o FAQ e o schema
    preco_unidade: "m²"     # "m²" ou "peça" (se for peça, revisar o FAQ do preço na página)
    lava_pet: false         # true quando a loja confirmar que lava tapete com xixi de cachorro/gato
    # [TIPOS DE TAPETE] — sugestão do documento de requisitos; CONFIRMAR com a loja
    tipos:
      - "Tapete de sala"
      - "Tapete felpudo"
      - "Tapete de banheiro"
      - "Tapete infantil"
    # Avaliações reais do Google que citam tapete (1 a 3). Vazio = seção escondida.
    # Formato de cada item:
    #   - nome: "Maria S."
    #     texto: "Texto exato da avaliação."
    #     url: "link da avaliação ou do Perfil"
    avaliacoes: []

  edredom:
    prazo: ""               # [PRAZO] ex.: "3 dias úteis" — liga o passo 3 e a pergunta do prazo
    preco: ""               # [PREÇO] "a partir de", só o número, ex.: "40,00" — liga a seção Preço, o FAQ e o schema
    preco_unidade: ""       # deixe vazio (o preço varia por tamanho)
    lava_pena: false        # [CONFIRMAR COM A LOJA] true se lava edredom de pena/plumas — liga a pergunta do FAQ
    # Peças que o site atual já confirma. Para incluir manta, travesseiro ou edredom de pena,
    # acrescente a linha aqui só depois que a loja confirmar.
    tipos:
      - "Edredom de todos os tamanhos"
      - "Cobertor"
      - "Lençóis"
      - "Fronhas"
    # Avaliações reais do Google que citam edredom (mesmo formato de tapetes). Vazio = seção escondida.
    avaliacoes: []

  roupas:
    preco: ""               # [PREÇO] só o número, ex.: "4,50" — liga a seção Preço e o schema
    preco_unidade: "peça"   # "peça" ou "cesto"
    # Lista copiada do card "Roupas do dia a dia & Roupas de festa" da home
    tipos:
      - "Camisas e Camisetas"
      - "Casacos e jaquetas"
      - "Casacos de lã batida"
      - "Ternos e vestidos de festa"
      - "Uniformes de empresas"
      - "Enxoval de bebês"

  planos:
    troca_plano: ""         # [CONFIRMAR COM A LOJA] resposta para "Posso trocar de plano?" — vazio = pergunta escondida

