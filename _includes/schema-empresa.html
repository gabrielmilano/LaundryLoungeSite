{%- assign e = site.data.negocio.empresa -%}
{%- assign fachada = site.data.negocio.fotos.fachada | strip %}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "DryCleaningOrLaundry",
      "@id": "{{ site.url }}/#empresa",
      "name": {{ e.nome | jsonify }},
      "url": "{{ site.url }}/",
      "telephone": {{ e.telefone_schema | jsonify }},
{%- if fachada != "" %}
      "image": {{ fachada | absolute_url | jsonify }},
{%- endif %}
      "priceRange": "$$",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": {{ e.rua | append: " - " | append: e.complemento | jsonify }},
        "addressLocality": {{ e.cidade | jsonify }},
        "addressRegion": {{ e.uf | jsonify }},
        "postalCode": {{ e.cep | jsonify }},
        "addressCountry": "BR"
      },
      "geo": { "@type": "GeoCoordinates", "latitude": {{ e.latitude }}, "longitude": {{ e.longitude }} },
      "openingHoursSpecification": [
{%- for h in e.horarios %}
        { "@type": "OpeningHoursSpecification", "dayOfWeek": {{ h.dias | jsonify }}, "opens": {{ h.abre | jsonify }}, "closes": {{ h.fecha | jsonify }} }{% unless forloop.last %},{% endunless %}
{%- endfor %}
      ],
      "sameAs": [
        {{ e.instagram_url | jsonify }},
        {{ e.facebook_url | jsonify }}
      ]
    }
    </script>
